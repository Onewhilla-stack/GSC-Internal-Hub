openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Gold Standard Cleaners internal management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: dashboard
    description: Dashboard stats
  - name: jobs
    description: Job tracker
  - name: expenses
    description: Expense tracker
  - name: clients
    description: Client database
  - name: receipts
    description: Receipt generator
  - name: analytics
    description: Analytics and P&L
  - name: settings
    description: Application settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ─────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/password:
    patch:
      operationId: updatePassword
      tags: [auth]
      summary: Change admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdate"
      responses:
        "200":
          description: Password updated
        "400":
          description: Bad request

  # ─── DASHBOARD ────────────────────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary stats for a given month
      parameters:
        - in: query
          name: month
          schema:
            type: string
          description: "Month in YYYY-MM format (defaults to current month)"
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: "Start date YYYY-MM-DD (inclusive); with 'to' overrides month"
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: "End date YYYY-MM-DD (inclusive); with 'from' overrides month"
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/daily-revenue:
    get:
      operationId: getDailyRevenue
      tags: [dashboard]
      summary: Daily revenue for current month (bar chart data)
      parameters:
        - in: query
          name: month
          schema:
            type: string
          description: "Month in YYYY-MM format"
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: "Start date YYYY-MM-DD (inclusive); with 'to' overrides month"
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: "End date YYYY-MM-DD (inclusive); with 'from' overrides month"
      responses:
        "200":
          description: Daily revenue array
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyRevenue"

  /dashboard/revenue-by-service:
    get:
      operationId: getRevenueByService
      tags: [dashboard]
      summary: Revenue by service type (donut chart data)
      parameters:
        - in: query
          name: month
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: "Start date YYYY-MM-DD (inclusive); with 'to' overrides month"
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: "End date YYYY-MM-DD (inclusive); with 'from' overrides month"
      responses:
        "200":
          description: Revenue by service
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRevenue"

  /dashboard/top-clients:
    get:
      operationId: getTopClients
      tags: [dashboard]
      summary: Top 5 clients by amount this month
      parameters:
        - in: query
          name: month
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date
          description: "Start date YYYY-MM-DD (inclusive); with 'to' overrides month"
        - in: query
          name: to
          schema:
            type: string
            format: date
          description: "End date YYYY-MM-DD (inclusive); with 'from' overrides month"
      responses:
        "200":
          description: Top clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopClient"

  /dashboard/recent-jobs:
    get:
      operationId: getRecentJobs
      tags: [dashboard]
      summary: Last 10 jobs logged
      responses:
        "200":
          description: Recent jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  # ─── JOBS ─────────────────────────────────────────────────────────────────
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs with optional filters
      parameters:
        - in: query
          name: month
          schema:
            type: string
          description: "Filter by month YYYY-MM (fallback when from/to absent)"
        - in: query
          name: from
          schema:
            type: string
          description: "Range start date YYYY-MM-DD (inclusive)"
        - in: query
          name: to
          schema:
            type: string
          description: "Range end date YYYY-MM-DD (inclusive)"
        - in: query
          name: serviceType
          schema:
            type: string
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Log a new job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/import:
    post:
      operationId: importJobs
      tags: [jobs]
      summary: Import jobs from CSV rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobImport"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a single job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── EXPENSES ─────────────────────────────────────────────────────────────
  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expenses with filters
      parameters:
        - in: query
          name: month
          schema:
            type: string
          description: "Filter by month YYYY-MM (fallback when from/to absent)"
        - in: query
          name: from
          schema:
            type: string
          description: "Range start date YYYY-MM-DD (inclusive)"
        - in: query
          name: to
          schema:
            type: string
          description: "Range end date YYYY-MM-DD (inclusive)"
        - in: query
          name: category
          schema:
            type: string
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Log a new expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /expenses/import:
    post:
      operationId: importExpenses
      tags: [expenses]
      summary: Import expenses from CSV rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseImport"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /expenses/monthly-summary:
    get:
      operationId: getExpensesMonthlySummary
      tags: [expenses]
      summary: Monthly expense breakdown by category
      parameters:
        - in: query
          name: month
          schema:
            type: string
          description: "Month YYYY-MM (fallback when from/to absent; defaults to current month)"
        - in: query
          name: from
          schema:
            type: string
          description: "Range start date YYYY-MM-DD (inclusive)"
        - in: query
          name: to
          schema:
            type: string
          description: "Range end date YYYY-MM-DD (inclusive)"
      responses:
        "200":
          description: Monthly summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseCategorySummary"

  /expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── CLIENTS ──────────────────────────────────────────────────────────────
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Add a new client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/import:
    post:
      operationId: importClients
      tags: [clients]
      summary: Import clients from CSV rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientImport"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get client profile with stats and transaction history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientProfile"
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update client details
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── RECEIPTS ─────────────────────────────────────────────────────────────
  /receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      summary: List all receipts
      parameters:
        - name: month
          in: query
          schema:
            type: string
          description: "Filter by month YYYY-MM (fallback when from/to absent)"
        - name: from
          in: query
          schema:
            type: string
          description: "Range start date YYYY-MM-DD (inclusive)"
        - name: to
          in: query
          schema:
            type: string
          description: "Range end date YYYY-MM-DD (inclusive)"
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: serviceType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Create a receipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"

  /receipts/summary:
    get:
      operationId: getReceiptsSummary
      tags: [receipts]
      summary: Summary counts and totals for receipts in a date range
      parameters:
        - name: month
          in: query
          schema:
            type: string
          description: "Month YYYY-MM (fallback when from/to absent; defaults to current month)"
        - name: from
          in: query
          schema:
            type: string
          description: "Range start date YYYY-MM-DD (inclusive)"
        - name: to
          in: query
          schema:
            type: string
          description: "Range end date YYYY-MM-DD (inclusive)"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptsSummary"

  /receipts/{id}:
    get:
      operationId: getReceipt
      tags: [receipts]
      summary: Get a single receipt
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
    patch:
      operationId: updateReceipt
      tags: [receipts]
      summary: Update payment status or notes on a receipt
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptUpdate"
      responses:
        "200":
          description: Updated receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
    delete:
      operationId: deleteReceipt
      tags: [receipts]
      summary: Delete a receipt
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── ANALYTICS ────────────────────────────────────────────────────────────
  /analytics/pl:
    get:
      operationId: getPLSummary
      tags: [analytics]
      summary: Monthly P&L summary for all months
      responses:
        "200":
          description: P&L table
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PLMonth"

  /analytics/revenue-trend:
    get:
      operationId: getRevenueTrend
      tags: [analytics]
      summary: Revenue trend line chart data across all months
      responses:
        "200":
          description: Revenue trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyTrend"

  /analytics/service-breakdown:
    get:
      operationId: getServiceBreakdown
      tags: [analytics]
      summary: Revenue by service type across all months
      responses:
        "200":
          description: Service breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRevenue"

  /analytics/expense-breakdown:
    get:
      operationId: getExpenseBreakdown
      tags: [analytics]
      summary: Expenses by category across all months
      responses:
        "200":
          description: Expense breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseCategorySummary"

  /analytics/key-stats:
    get:
      operationId: getKeyStats
      tags: [analytics]
      summary: Key summary stats (best month, top client, averages)
      responses:
        "200":
          description: Key stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyStats"

  /analytics/month-drill:
    get:
      operationId: getMonthDrill
      tags: [analytics]
      summary: Full breakdown for a specific month
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Month drill-down
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthDrill"

  # ─── SETTINGS ─────────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /settings/export:
    get:
      operationId: exportData
      tags: [settings]
      summary: Export data as JSON backup
      responses:
        "200":
          description: Full data backup JSON
          content:
            application/json:
              schema:
                type: object

  # ─── AUDIT LOG ────────────────────────────────────────────────────────────
  /audit-log:
    get:
      operationId: getAuditLog
      tags: [auth]
      summary: Get activity log (directors only)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Activity log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLogEntry"
        "403":
          description: Director access required

  # ─── WORKER DASHBOARD ─────────────────────────────────────────────────────
  /worker/dashboard:
    get:
      operationId: getWorkerDashboard
      tags: [dashboard]
      summary: Worker dashboard (today jobs)
      responses:
        "200":
          description: Worker dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerDashboard"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ──
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    PasswordUpdate:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }

    AuthUser:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string }

    # ── Dashboard ──
    DashboardStats:
      type: object
      required: [revenue, expenses, netProfit, jobCount, revenueChange, expensesChange, netProfitChange, jobCountChange]
      properties:
        revenue: { type: number }
        expenses: { type: number }
        netProfit: { type: number }
        jobCount: { type: integer }
        revenueChange: { type: number }
        expensesChange: { type: number }
        netProfitChange: { type: number }
        jobCountChange: { type: number }

    DailyRevenue:
      type: object
      required: [day, revenue]
      properties:
        day: { type: string }
        revenue: { type: number }

    ServiceRevenue:
      type: object
      required: [serviceType, revenue]
      properties:
        serviceType: { type: string }
        revenue: { type: number }

    ServiceCount:
      type: object
      required: [serviceType, count]
      properties:
        serviceType: { type: string }
        count: { type: integer }

    ServiceCountDelta:
      type: object
      required: [serviceType, count, delta]
      properties:
        serviceType: { type: string }
        count: { type: integer }
        delta: { type: integer }

    TopClient:
      type: object
      required: [clientName, totalSpent, jobCount]
      properties:
        clientName: { type: string }
        totalSpent: { type: number }
        jobCount: { type: integer }

    # ── Jobs ──
    JobItem:
      type: object
      required: [serviceType, amount]
      properties:
        serviceType: { type: string }
        description: { type: ["string", "null"] }
        amount: { type: number }

    JobItemInput:
      type: object
      required: [serviceType, amount]
      properties:
        serviceType: { type: string }
        description: { type: string }
        amount: { type: number, minimum: 0 }

    Job:
      type: object
      required: [id, date, clientName, serviceType, amount, teamMembers, wages, netIncome, createdAt]
      properties:
        id: { type: integer }
        clientId: { type: ["integer", "null"] }
        date: { type: string }
        clientName: { type: string }
        serviceType: { type: string }
        description: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        items:
          type: ["array", "null"]
          items: { $ref: "#/components/schemas/JobItem" }
        amount: { type: number }
        teamMembers: { type: integer }
        wages: { type: number }
        netIncome: { type: number }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }

    JobInput:
      type: object
      required: [date, clientName, teamMembers]
      properties:
